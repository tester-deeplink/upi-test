<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #e0e7ff, transparent 40%),
                radial-gradient(circle at bottom right, #ddd6fe, transparent 40%),
                #f8fafc;

            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 36px 30px 30px;

            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;

            box-shadow:
                0 24px 60px rgba(30, 41, 59, 0.12),
                0 4px 12px rgba(30, 41, 59, 0.06);

            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 7px 12px;
            margin-bottom: 22px;

            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 20px;

            color: white;
            font-size: 30px;

            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.25);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            letter-spacing: -0.03em;
        }

        .description {
            margin: 0 auto 28px;
            max-width: 310px;

            color: #64748b;
            font-size: 15px;
            line-height: 1.55;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            width: 100%;
            display: block;

            padding: 16px 20px;

            border-radius: 14px;
            text-decoration: none;

            font-size: 16px;
            font-weight: 650;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background 0.15s ease;
        }

        .button:active {
            transform: scale(0.98);
        }

        .primary {
            color: white;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);

            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.25);
        }

        .primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.3);
        }

        .secondary {
            color: #334155;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        .secondary:hover {
            background: #e9eef5;
        }

        .footer {
            margin-top: 24px;

            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="badge">UPI TEST</div>

        <div class="icon">₹</div>

        <h1>Complete your payment</h1>

        <p class="description">
            Tap the button below to open a supported UPI payment app on your device.
        </p>

        <div class="buttons">

            <a
                class="button primary"
                href="upi://pay?pa=elaninetradeent.7233@jiomerchant&pn=ELANINETRADE&mc=5699&tr=PINW14QFSDZUFL0B0GF9KIZR&tn=payment&am=1000.0&cu=INR&mode=05&orgid=JIOP&category=01&QRexpire=2026-09-03T18:13:19.805674685+05:30&sign=N1bzhXQNP+iumLagTL2SKolVyZ1ldEvD2jhR9D36IzemkFdNdn3+SIZkNIhomd+z7GPLP28riK5v5p68seYhMpVe+w+9GIgLu04Lw2V2qbfSgPs+1OGw6RAt1wVZzjAZD3p0ROnc69C0zZ9QLNIK3np59Xmn/BlJNXZ7KkAHKWsK2Cd9mjfW1vBukIhWbW446fV60w0gXp4BbeXCkTL/xsKCR7/7AQfnWSHjPpiZEnrtEh1odUrzmrz2ZbQlamP6Im6+WFM7CKYoQaZzuXYK1ahisEuwAvnJf47i5nK4B+FO09m1DVhn7dLRF9l3w1yGx9VX3DlhuoDsqplPknE04g=="
            >
                Pay with UPI
            </a>

            <a
                class="button secondary"
                href="https://api.zuvix.top/v1/mock-merchant/pending"
            >
                I've completed the payment
            </a>

        </div>

        <div class="footer">
            Deeplink testing page
        </div>

    </main>

</body>
</html>
