        body {
            margin: 0;

            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

        }

        .card {
            width: 100%;

        }

            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            transition: 0.2s ease;

        .btn-pay {
            background: #4f46e5;
            color: white;

        }

        .btn-pay:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.3);
        }

        .btn-done {
            background: #f3f4f6;
            color: #111827;
        }

        .btn-done:hover {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
